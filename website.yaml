title:
  zh: "我们如何知道？——问题驱动的认识论"
  en: "How Do We Know? A Problem-Driven Epistemology"

summary:
  zh: "一个以学习、整合与问题驱动方式组织的中文认识论教材项目，涵盖知识、怀疑、证成、认识来源、社会与形式认识论、认识价值、数字与 AI 环境以及比较认识论。"
  en: "A Chinese-language epistemology textbook and learning project organized through study, synthesis, and philosophical problems, covering knowledge, skepticism, justification, sources of knowledge, social and formal epistemology, epistemic value, digital and AI environments, and comparative epistemology."

status:
  zh: "PPF Phase 1 已完成并通过真实运行验证：Quarto QMD 为唯一正式书稿来源；Web profile 的 HTML 经验证后继续自动部署到现有 GitHub Pages。EPUB、PDF、DOCX 与 LaTeX 使用独立 profile 按需构建，不自动成为正式 release。Cloudflare Workers Static Assets 属于 Phase 2 staged target，尚未切换生产。"
  en: "PPF Phase 1 is complete and runtime-validated: canonical Quarto QMD remains the sole manuscript source, validated Web-profile HTML continues to deploy automatically to the existing GitHub Pages site, and EPUB/PDF/DOCX/LaTeX remain separate on-demand build profiles rather than formal releases by default. Cloudflare Workers Static Assets is a staged Phase 2 target, not yet the production provider."

