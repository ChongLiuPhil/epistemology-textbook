<script>
document.addEventListener("DOMContentLoaded", function () {
  const main = document.querySelector("main.content");
  if (!main) return;

  const desktopToc = document.querySelector("#quarto-margin-sidebar #TOC");
  const titleBlock = main.querySelector(":scope > #title-block-header");
  const tocList = desktopToc ? desktopToc.querySelector(":scope > ul") : null;

  if (!titleBlock || !tocList || tocList.children.length === 0) return;
  if (main.querySelector(".mobile-chapter-toc")) return;

  const mobileToc = document.createElement("details");
  mobileToc.className = "mobile-chapter-toc";

  const summary = document.createElement("summary");
  summary.textContent = "本章目录";
  mobileToc.appendChild(summary);

  const nav = document.createElement("nav");
  nav.setAttribute("aria-label", "本章目录");

  const clonedList = tocList.cloneNode(true);
  clonedList.querySelectorAll("[id]").forEach(function (node) {
    node.removeAttribute("id");
  });
  clonedList.querySelectorAll(".collapse").forEach(function (node) {
    node.classList.remove("collapse");
  });

  nav.appendChild(clonedList);
  mobileToc.appendChild(nav);

  nav.querySelectorAll("a[href^='#']").forEach(function (link) {
    link.addEventListener("click", function () {
      mobileToc.removeAttribute("open");
    });
  });

  titleBlock.insertAdjacentElement("afterend", mobileToc);
});
</script>
