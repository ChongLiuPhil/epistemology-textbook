schema_version: 1
mode: workers-builds-git

git:
  provider: github
  repository: ChongLiuPhil/epistemology-textbook
  production_branch: main
  non_production_branch_builds: true
  root_directory: "/"

commands:
  build: "bash scripts/cloudflare_build.sh"
  deploy: "npm run cloudflare:deploy"
  preview_deploy: "npm run cloudflare:preview"

toolchain:
  node: "24"
  wrangler: "4.135.0"
  quarto: "1.10.18"

worker:
  name: epistemology-textbook
  config: wrangler.jsonc
  static_assets_directory: ./_book

connection:
  cloudflare_account: human-confirmed
  github_app: verified-via-github-checks
  repository_connection: verified
  worker_target: verified
  production_trigger: verified-main-build-passed
  preview_trigger: verified-preview-build-passed
  build_token: cloudflare-managed-default-reviewed-broad-scope
  workers_dev_url: "https://epistemology-textbook.philosophy-research.workers.dev"

validation:
  main_build:
    status: passed
    git_commit: "185f7c0ccedc374cf7b17f0349f6eb6add8a27e7"
    github_check_id: 105864886964
    cloudflare_build_id: "d6bc8b62-78ba-4a9e-98ea-7a049a539858"
  first_preview_build:
    status: passed
    git_commit: "ba94fadc83f81b4504ab8a6dd8a937e2999b9397"
    github_check_id: 105865023566
    cloudflare_build_id: "a12446a5-e341-48e4-8c22-1a184b1102c8"
    version_id: "3f8a15d6-9994-4e90-839c-2144c8dc54b7"
    preview_url: "https://3f8a15d6-epistemology-textbook.philosophy-research.workers.dev"
    preview_alias_url: "https://cloudflare-preview-probe-epistemology-textbook.philosophy-research.workers.dev"
  workers_dev_http: passed-via-github-actions
  runtime_http_verification:
    workflow_run: 35431565729
    main_endpoint: passed
    preview_endpoint: passed
  latest_main_build:
    status: passed
    git_commit: "f79e202c46eccf6868debf585e2d8ba2dfb9eb51"
    github_check_id: 105867581534
    cloudflare_build_id: "6eb6fb9a-34c0-4605-8670-98aea31fe2a5"
  production_trigger_activation: staging-only

security:
  credentials_in_repository: prohibited
  github_app_repository_scope: selected-repositories-only
  build_token_policy: cloudflare-managed-default-reviewed-broad-scope
  broad_default_token_requires_review: false
  profiles:
    workers_builds_native:
      status: operational-verified
      token_type: cloudflare-managed-user-token
      least_privilege: false
    hardened_external_ci:
      status: available-not-adopted
      token_type: account-owned-api-token
      desired_scope: individual-worker-epistemology-textbook
      desired_role: editor
      least_privilege: true
    future_native_granular:
      status: unsupported-currently
      desired_token_type: account-owned-api-token
      desired_scope: individual-worker-epistemology-textbook
      desired_role: editor
      blocker: workers-builds-user-token-only
