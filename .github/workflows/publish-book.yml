name: Build and Publish Quarto Book

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "book.css"
      - "epub.css"
      - "scripts/check_quarto.py"
      - "Makefile"
      - ".github/workflows/publish-book.yml"
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "book.css"
      - "epub.css"
      - "scripts/check_quarto.py"
      - "Makefile"
      - ".github/workflows/publish-book.yml"

permissions:
  contents: write

concurrency:
  group: quarto-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical Quarto sources
        run: make check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML and EPUB
        run: quarto render

      - name: Validate rendered book
        run: |
          test -f _book/index.html
          test -f _book/manuscript/01-knowledge.html
          test -f _book/manuscript/09-comparative.html
          test -f _book/manuscript/glossary.html
          test -f _book/manuscript/references.html
          test -f _book/how-do-we-know.epub

      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: epistemology-reading-site
          path: _book/
          if-no-files-found: error
          retention-days: 14

      - name: Upload EPUB ebook
        uses: actions/upload-artifact@v4
        with:
          name: epistemology-textbook-epub
          path: _book/how-do-we-know.epub
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated book to gh-pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch _book/.nojekyll
          cd _book
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
