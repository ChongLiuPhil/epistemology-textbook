name: Validate and Publish Quarto Book

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "textbook/**"
      - "website/**"
      - "scripts/build_web.py"
      - "book.css"
      - "_quarto.yml"
      - "index.qmd"
      - "Makefile"
      - ".github/workflows/publish-book.yml"
  push:
    paths:
      - "textbook/**"
      - "website/**"
      - "scripts/build_web.py"
      - "book.css"
      - "_quarto.yml"
      - "index.qmd"
      - "Makefile"
      - ".github/workflows/publish-book.yml"

permissions:
  contents: write

concurrency:
  group: quarto-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate reading sources
        run: python3 scripts/build_web.py --check

      - name: Upload generated Quarto sources
        uses: actions/upload-artifact@v4
        with:
          name: quarto-generated-sources
          path: website/generated/*.qmd
          if-no-files-found: error
          retention-days: 7

      - name: Promote Quarto sources to canonical manuscript
        if: github.ref == 'refs/heads/refactor/quarto-source-of-truth' && github.event_name == 'push'
        run: |
          mkdir -p manuscript
          cp website/generated/*.qmd manuscript/
          cp textbook/references.bib references.bib
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('manuscript').glob('*.qmd'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'^source-file:.*\n', '', text, flags=re.M)
              text = text.replace('<div class="source-note">本页由 LaTeX 主稿自动生成；请勿直接编辑生成文件。</div>\n', '')
              text = text.replace('以下条目由全书引文自动汇总。', '以下条目由本书 Quarto 引文自动汇总。')
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript references.bib
          if ! git diff --cached --quiet; then
            git commit -m "content: promote Quarto manuscript as canonical source"
            git push
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render HTML book
        run: quarto render --to html

      - name: Validate rendered book
        run: |
          test -f _book/index.html
          test -f _book/website/generated/01-knowledge.html
          test -f _book/website/generated/09-comparative.html
          test -f _book/website/generated/glossary.html
          test -f _book/website/generated/references.html

      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: epistemology-reading-site
          path: _book/
          if-no-files-found: error
          retention-days: 14

      - name: Publish validated HTML to GitHub Pages branch
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
