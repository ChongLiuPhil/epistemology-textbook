name: PPF Pilot Format Validation

on:
  pull_request:
    paths:
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "publishing.yaml"
      - ".github/workflows/build-publication-formats.yml"
      - ".github/workflows/ppf-pilot-format-validation.yml"

permissions:
  contents: read

jobs:
  validate-format:
    name: validate-${{ matrix.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format:
          - epub
          - pdf
          - docx
          - latex

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chinese fonts for PDF
        if: matrix.format == 'pdf'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install TinyTeX for PDF
        if: matrix.format == 'pdf'
        run: quarto install tinytex --no-prompt

      - name: Render requested PPF profile
        run: quarto render --profile "${{ matrix.format }}"

      - name: Verify generated artifact
        shell: bash
        run: |
          set -euo pipefail
          format="${{ matrix.format }}"
          output="_publication/$format"

          case "$format" in
            epub) extension="epub" ;;
            pdf) extension="pdf" ;;
            docx) extension="docx" ;;
            latex) extension="tex" ;;
          esac

          test -d "$output"
          test -n "$(find "$output" -type f -name "*.$extension" -print -quit)"
