name: Repository Governance CI

on:
  pull_request:
    paths:
      - "START_HERE.zh-CN.md"
      - "ONBOARDING_CHECK.zh-CN.md"
      - "AGENTS.md"
      - "HARC_MANIFEST.yaml"
      - "HARC_CONTEXT_INTERFACE.yaml"
      - "core/**"
      - "docs/working-memory.zh-CN.md"
      - "docs/working-memory/**"
      - "docs/book-architecture.zh-CN.md"
      - "docs/framework-status.zh-CN.md"
      - "docs/release-status.zh-CN.md"
      - "docs/ppf-adoption.md"
      - "docs/publication-profile.zh-CN.md"
      - "docs/publication-profile.zh-CN.md"
      - "docs/cloudflare-readiness.yaml"
      - "docs/cloudflare-readiness.zh-CN.md"
      - "docs/cloudflare-staging-runbook.zh-CN.md"
      - "docs/examples/cloudflare-staging-workflow.yml"
      - "LICENSE-DECISION.md"
      - "CITATION.cff"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "project.yaml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "reference/README.md"
      - "textbook/README.md"
      - "website/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/check_repository_state.py"
      - "scripts/check_cloudflare_readiness.py"
      - ".github/workflows/governance-ci.yml"
  push:
    branches: [main]
    paths:
      - "START_HERE.zh-CN.md"
      - "ONBOARDING_CHECK.zh-CN.md"
      - "AGENTS.md"
      - "HARC_MANIFEST.yaml"
      - "HARC_CONTEXT_INTERFACE.yaml"
      - "core/**"
      - "docs/working-memory.zh-CN.md"
      - "docs/working-memory/**"
      - "docs/book-architecture.zh-CN.md"
      - "docs/framework-status.zh-CN.md"
      - "docs/release-status.zh-CN.md"
      - "docs/ppf-adoption.md"
      - "docs/cloudflare-readiness.yaml"
      - "docs/cloudflare-readiness.zh-CN.md"
      - "docs/cloudflare-staging-runbook.zh-CN.md"
      - "docs/examples/cloudflare-staging-workflow.yml"
      - "LICENSE-DECISION.md"
      - "CITATION.cff"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "project.yaml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "reference/README.md"
      - "textbook/README.md"
      - "website/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/check_repository_state.py"
      - "scripts/check_cloudflare_readiness.py"
      - ".github/workflows/governance-ci.yml"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository collaboration state
        run: python3 scripts/check_repository_state.py
