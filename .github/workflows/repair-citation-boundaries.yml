name: One-time citation boundary repair

on:
  push:
    branches: [fix/rendered-integrity-citations]
    paths:
      - "scripts/repair_citation_boundaries.py"
      - ".github/workflows/repair-citation-boundaries.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/rendered-integrity-citations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair CJK citation boundaries
        run: python3 scripts/repair_citation_boundaries.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit repaired QMD sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.qmd manuscript/*.qmd
          git commit -m "fix: separate bare citations from Chinese text"
          git push origin HEAD:fix/rendered-integrity-citations
