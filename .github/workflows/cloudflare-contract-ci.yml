name: Cloudflare Build Contract CI

on:
  pull_request:
    paths:
      - "cloudflare-builds.yaml"
      - "wrangler.jsonc"
      - "package.json"
      - ".nvmrc"
      - "publishing.yaml"
      - "docs/cloudflare-readiness.yaml"
      - "scripts/ensure_quarto.sh"
      - "scripts/cloudflare_build.sh"
      - "scripts/check_cloudflare_readiness.py"
      - "scripts/check_rendered_html.py"
      - "Makefile"
      - ".github/workflows/cloudflare-contract-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare-builds.yaml"
      - "wrangler.jsonc"
      - "package.json"
      - ".nvmrc"
      - "publishing.yaml"
      - "docs/cloudflare-readiness.yaml"
      - "scripts/ensure_quarto.sh"
      - "scripts/cloudflare_build.sh"
      - "scripts/check_cloudflare_readiness.py"
      - "scripts/check_rendered_html.py"
      - "Makefile"
      - ".github/workflows/cloudflare-contract-ci.yml"

permissions:
  contents: read

jobs:
  validate-cloudflare-build-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install pinned Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Wrangler version
        run: test "$(npx wrangler --version | tail -n 1)" = "4.135.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulate Workers Builds Web build
        run: make cloudflare-build
