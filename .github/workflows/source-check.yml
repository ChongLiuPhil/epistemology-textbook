name: Quarto source check

on:
  push:
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "scripts/check_quarto.py"
      - "Makefile"
      - ".github/workflows/source-check.yml"
  pull_request:
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "scripts/check_quarto.py"
      - "Makefile"
      - ".github/workflows/source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check canonical Quarto sources
        run: make check
