name: Quarto HTML CI and Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "_quarto-*.yml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "book.css"
      - "assets/**"
      - "project.yaml"
      - "website.yaml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/**"
      - "Makefile"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/html-ci.yml"
      - ".github/workflows/build-publication-formats.yml"
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "book.css"
      - "assets/**"
      - "project.yaml"
      - "website.yaml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/**"
      - "Makefile"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/html-ci.yml"
      - ".github/workflows/build-publication-formats.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quarto-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-html:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical Quarto sources
        run: make check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Web profile
        run: quarto render --profile web

      - name: Validate rendered HTML
        shell: bash
        run: |
          set -euo pipefail
          test -f _book/index.html
          test -f _book/manuscript/00-open-access-and-support.html
          test -f _book/manuscript/01-knowledge.html
          test -f _book/manuscript/05-social-knowledge.html
          test -f _book/manuscript/09-comparative.html
          test -f _book/manuscript/study-guide.html
          test -f _book/manuscript/research-studio.html
          test -f _book/manuscript/glossary.html
          test -f _book/manuscript/references.html

          grep -q "本书目录" _book/index.html
          grep -q "当前阅读版本" _book/index.html
          grep -q "本章目录" _book/manuscript/01-knowledge.html
          grep -q "版本、引用与来源" _book/manuscript/00-open-access-and-support.html
          grep -q "github.com/ChongLiuPhil/epistemology-textbook" _book/manuscript/01-knowledge.html

          python3 scripts/check_rendered_html.py

          if find _book -type f \( -name '*.epub' -o -name '*.pdf' -o -name '*.docx' -o -name '*.tex' \) -print -quit | grep -q .; then
            echo "Unexpected release-format artifact found in _book" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-html
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated HTML to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
