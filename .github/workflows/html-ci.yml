name: Quarto HTML CI and Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "cloudflare-builds.yaml"
      - "package.json"
      - ".nvmrc"
      - "docs/cloudflare-readiness.yaml"
      - "docs/cloudflare-readiness.zh-CN.md"
      - "docs/cloudflare-staging-runbook.zh-CN.md"
      - "docs/examples/cloudflare-staging-workflow.yml"
      - "book.css"
      - "assets/**"
      - "project.yaml"
      - "website.yaml"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "docs/ppf-adoption.md"
      - "scripts/**"
      - "Makefile"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/html-ci.yml"
      - ".github/workflows/build-publication-formats.yml"
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "references.bib"
      - "index.qmd"
      - "_quarto.yml"
      - "_quarto-*.yml"
      - "publishing.yaml"
      - "wrangler.jsonc"
      - "docs/cloudflare-readiness.yaml"
      - "docs/cloudflare-readiness.zh-CN.md"
      - "docs/cloudflare-staging-runbook.zh-CN.md"
      - "docs/examples/cloudflare-staging-workflow.yml"
      - "book.css"
      - "assets/**"
      - "project.yaml"
      - "website.yaml"
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "docs/ppf-adoption.md"
      - "scripts/**"
      - "Makefile"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/html-ci.yml"
      - ".github/workflows/build-publication-formats.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quarto-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-html:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run canonical Web publication gate
        run: make web-publish-check

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-html
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated HTML to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
