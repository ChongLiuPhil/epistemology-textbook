name: External Link Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - "index.qmd"
      - "manuscript/**"
      - "references.bib"
      - "_quarto.yml"
      - "_quarto-web.yml"
      - "publishing.yaml"
      - "book.css"
      - "project.yaml"
      - "website.yaml"
      - "scripts/check_external_links.py"
      - ".github/workflows/external-link-audit.yml"

permissions:
  contents: read

jobs:
  audit-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check canonical sources and bibliography
        run: make check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Web profile
        run: quarto render --profile web

      - name: Audit external links
        run: python3 scripts/check_external_links.py --strict
