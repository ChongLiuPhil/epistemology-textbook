project:
  type: book
  output-dir: _book

book:
  title: "我们如何知道？"
  subtitle: "问题驱动的认识论"
  author: "Chong Liu"
  output-file: "how-do-we-know"
  site-url: "https://chongliuphil.github.io/epistemology-textbook/"
  repo-url: "https://github.com/ChongLiuPhil/epistemology-textbook"
  repo-branch: main
  repo-actions: [issue, source]
  repo-link-target: _blank
  reader-mode: true
  back-to-top-navigation: true
  bread-crumbs: true
  open-graph: true
  page-navigation: true
  search: true
  sidebar:
    header: "**本书目录**"
    style: docked
    collapse-level: 1
    tools:
      - icon: github
        href: "https://github.com/ChongLiuPhil/epistemology-textbook"
    footer: |
      [开放阅读与支持](https://chongliuphil.github.io/epistemology-textbook/manuscript/00-open-access-and-support.html) · [报告问题](https://github.com/ChongLiuPhil/epistemology-textbook/issues/new/choose)
  page-footer:
    border: true
    left: "《我们如何知道？》开放 Web Edition · 持续修订"
    right:
      - text: "开放阅读与支持"
        href: "https://chongliuphil.github.io/epistemology-textbook/manuscript/00-open-access-and-support.html"
      - text: "报告问题"
        href: "https://github.com/ChongLiuPhil/epistemology-textbook/issues/new/choose"
  chapters:
    - index.qmd
    - manuscript/00-open-access-and-support.qmd
    - manuscript/00-preface.qmd
    - part: "第一部　知识、怀疑与理由"
      chapters:
        - manuscript/01-knowledge.qmd
        - manuscript/02-skepticism-luck.qmd
        - manuscript/03-justification-context.qmd
    - part: "第二部　认识来源、社会系统与理性模型"
      chapters:
        - manuscript/04-sources.qmd
        - manuscript/05-social-knowledge.qmd
        - manuscript/06-formal.qmd
    - part: "第三部　认识价值、技术环境与比较方法"
      chapters:
        - manuscript/07-value.qmd
        - manuscript/08-digital-ai.qmd
        - manuscript/09-comparative.qmd
    - part: "学习与研究"
      chapters:
        - manuscript/study-guide.qmd
        - manuscript/research-studio.qmd
        - manuscript/exercise-hints.qmd
        - manuscript/glossary.qmd
        - manuscript/references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "本章目录"
    toc-depth: 3
    number-sections: true
    citations-hover: true
    footnotes-hover: true
    code-copy: false
    css: book.css
    include-after-body:
      - assets/includes/reading-navigation.html
  pdf:
    toc: true
    number-sections: true
  docx:
    toc: true
  epub:
    toc: true

lang: zh-CN
