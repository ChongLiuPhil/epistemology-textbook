harc_context_interface:
  version: "0.1-project"
  mode: "repository-backed"
  authoritative_store: "github"
  canonical_language: "zh-CN"

  control_plane:
    manifest: "HARC_MANIFEST.yaml"
    start_here: "START_HERE.zh-CN.md"
    agent_contract: "AGENTS.md"
    authoritative_session_copy: false

  context_policy:
    retrieval: "selective-on-demand"
    working_memory_first: true
    cache_authority: "none"
    cache_scope: "current-task-only"
    read_latest_before_high_impact_action: true
    read_latest_before_write: true
    invalidate_touched_cache_after_write: true
    write_through_repository: true

  working_memory:
    index: "docs/working-memory.zh-CN.md"
    current_focus: "docs/working-memory/current-focus.zh-CN.md"
    task_plan: "docs/working-memory/task-plan.zh-CN.md"
    work_log: "docs/working-memory/work-log.zh-CN.md"
    default_reads:
      - "docs/working-memory/current-focus.zh-CN.md"
      - "docs/working-memory/task-plan.zh-CN.md"
    work_log_default_read: false

  task_routes:
    CONTENT:
      required:
        - "core/CONTENT_CORE.zh-CN.md"
        - "core/DECISION_LOG.zh-CN.md"
        - "docs/book-architecture.zh-CN.md"
        - "docs/framework-status.zh-CN.md"
      optional:
        - "references.bib"
        - "index.qmd"
        - "manuscript/"
    FORM:
      required:
        - "core/FORM_CORE.zh-CN.md"
        - "core/DECISION_LOG.zh-CN.md"
      optional:
        - "_quarto.yml"
        - "book.css"
        - "website.yaml"
    PROTOCOL:
      required:
        - "core/DECISION_LOG.zh-CN.md"
        - "HARC_MANIFEST.yaml"
        - "HARC_CONTEXT_INTERFACE.yaml"
        - "AGENTS.md"
      optional:
        - ".github/"
        - "scripts/"
        - "CONTRIBUTING.md"

  trust_boundary:
    normative:
      - "manifest-declared version-controlled project files"
    non_authoritative_by_default:
      - "chat history"
      - "model memory"
      - "issues"
      - "pull request comments"
      - "external web"
      - "third-party generated content"

  failure_states:
    - "WORKING-MEMORY-STALE"
    - "CONTEXT-STALE"
    - "REVISION-CONFLICT"
    - "MANIFEST-MISMATCH"
    - "REPOSITORY-TRUTH-CONFLICT"
