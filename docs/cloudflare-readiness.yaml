schema_version: 2
reviewed_at: 2026-09-19

provider:
  current: github-pages
  target: cloudflare-workers

integration:
  preferred_mode: workers-builds-git
  contract: cloudflare-builds.yaml
  external_ci_fallback: github-actions-wrangler

repository:
  status: workers-builds-contract-ready
  canonical_publish_gate: "make web-publish-check"
  cloudflare_build_wrapper: scripts/cloudflare_build.sh
  web_profile: _quarto-web.yml
  web_output: _book
  wrangler_config: wrangler.jsonc
  worker_name: epistemology-textbook
  static_assets_directory: ./_book
  active_github_actions_cloudflare_deploy: false

toolchain:
  node: "24"
  wrangler: "4.135.0"
  quarto: "1.10.18"

permission_model:
  ai_account_control:
    preferred: cloudflare-oauth-mcp
    api_mcp: "https://mcp.cloudflare.com/mcp"
    builds_mcp: "https://builds.mcp.cloudflare.com/mcp"
  github_connection:
    mechanism: cloudflare-workers-pages-github-app
    repository_scope: selected-repositories-only
  workers_builds:
    default_build_token: allowed-with-security-review
    restricted_user_token: preferred-for-hardened-setup
  external_ci_fallback:
    target_scope: individual-worker
    role: editor
    long_lived: false-unless-workers-builds-unavailable

staging:
  strategy: workers-builds-preview-before-production-cutover
  runbook: docs/cloudflare-staging-runbook.zh-CN.md
  human_handoff: docs/cloudflare-human-authorization.zh-CN.md
  workers_builds_contract: cloudflare-builds.yaml
  github_actions_deploy_enabled: false

account_side:
  status: unverified
  cloudflare_oauth_mcp: unavailable-in-current-session
  cloudflare_account: unverified
  github_app: unverified
  repository_connection: unverified
  worker_target: unverified
  production_trigger: unverified
  preview_trigger: unverified
  build_token: unverified
  cloudflare_zone: unverified
  target_canonical_url: unresolved

validation:
  repository_validation_runs:
    governance: 35427051865
    github_web: 35427051858
    cloudflare_contract: 35427051853
  github_canonical_publish_gate: passed
  workers_builds_contract: passed
  first_preview_build: not-run
  workers_dev_http: not-run
  production_deployment: not-run
  production_http_verification: not-run

cutover:
  status: blocked
  blockers:
    - cloudflare-oauth-or-account-access
    - cloudflare-github-app-authorization
    - repository-connection
    - worker-target
    - workers-builds-triggers
    - build-token
    - first-preview-build
    - target-canonical-url
    - redirect-or-canonical-policy
