schema_version: 2
reviewed_at: 2026-09-19

provider:
  current: github-pages
  target: cloudflare-workers

integration:
  preferred_mode: workers-builds-git
  contract: cloudflare-builds.yaml
  external_ci_fallback: github-actions-wrangler

repository:
  status: workers-builds-contract-ready
  canonical_publish_gate: "make web-publish-check"
  cloudflare_build_wrapper: scripts/cloudflare_build.sh
  web_profile: _quarto-web.yml
  web_output: _book
  wrangler_config: wrangler.jsonc
  worker_name: epistemology-textbook
  static_assets_directory: ./_book
  active_github_actions_cloudflare_deploy: false

toolchain:
  node: "24"
  wrangler: "4.135.0"
  quarto: "1.10.18"

permission_model:
