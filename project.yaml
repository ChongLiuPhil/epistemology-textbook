notes: >
  Quarto QMD files plus references.bib remain the canonical manuscript source.
  PPF v0.1.0-draft at adopted commit 4dcc23efb165cabc8c259103409c86708c355451
  defines the publication lifecycle. The web profile is the continuous public
  format and Cloudflare Workers Builds delivers the verified workers.dev canonical
  production site. EPUB, PDF, DOCX, and LaTeX are explicit on-demand build
  artifacts. GitHub Pages legacy policy is RETIRE and its Unpublish site action
  is human-confirmed complete. Build does not imply Release Approval. The legacy
  textbook/ LaTeX tree remains historical only. The existing HARC-lite repository
  layout remains project-native and is functionally mapped into the current AHICP
  compatibility profile rather than duplicated as a second governance truth source.
