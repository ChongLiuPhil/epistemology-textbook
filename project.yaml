notes: >
  Quarto QMD files plus references.bib remain the canonical manuscript source.
  Personal Publishing Framework v0.1 Phase 1 is complete. The web profile is
  the default continuous format; EPUB, PDF, DOCX, and LaTeX are explicit
  on-demand build artifacts and all four profiles have passed real GitHub
  Actions runtime validation. Validated HTML continues to deploy automatically
  to the existing GitHub Pages production URL, and the Phase 1 main deployment
  passed. Cloudflare Workers Static Assets remains a staged Phase 2 target, not
  active production infrastructure, until a Worker target, credentials,
  canonical URL, preview deployment, and cutover/redirect policy are confirmed.
  Build does not imply Release Approval. The legacy textbook/ LaTeX tree remains
  historical only. HARC-lite collaboration governance remains unchanged by the
  publishing pilot and should be migrated separately if desired.
