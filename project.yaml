areas:
  - epistemology

topics:
  - knowledge
  - skepticism
  - epistemic-luck
  - justification
  - sources-of-knowledge
  - testimony
  - social-epistemology
  - formal-epistemology
  - epistemic-value
  - ai-epistemology
  - comparative-epistemology

source_of_truth:
  homepage: index.qmd
  manuscript: manuscript/
  bibliography: references.bib
  book_config: _quarto.yml
  web_profile: _quarto-web.yml
  publishing_contract: publishing.yaml

governance:
  profile: HARC-lite-book
  profile_version: 0.1.1
  protocol_source: ChongLiuPhil/Human-AI-Research-Collaboration-Protocol
  adopted_protocol_version: 0.2.0-draft
  adopted_protocol_commit: e741c43c5cd158c43910e3832c7d757226717a97
  canonical_language: zh-CN
  context_mode: repository-backed
  start_here: START_HERE.zh-CN.md
  onboarding_check: ONBOARDING_CHECK.zh-CN.md
  agent_contract: AGENTS.md
  decision_log: core/DECISION_LOG.zh-CN.md
  working_memory: docs/working-memory.zh-CN.md
  release_status: docs/release-status.zh-CN.md

publishing:
  framework: Personal-Publishing-Framework
  adopted_framework_version: v0.1.0-draft
  adopted_framework_commit: 9326920e1920d18f0a71eac26d4068da9d6bdffe
  contract: publishing.yaml
  phase: ppf-pilot-phase-1
  continuous_format: html
  on_demand_formats:
    - epub
    - pdf
    - docx
    - latex
  current_web_provider: github-pages
  target_web_provider: cloudflare-workers
  cloudflare_cutover: pending

website:
  metadata: website.yaml
  default_publish: true

notes: >
  Quarto QMD files plus references.bib remain the canonical manuscript source.
  The project now pilots Personal Publishing Framework v0.1 using Quarto profiles:
  web is the default continuous format; EPUB, PDF, DOCX, and LaTeX are explicit
  on-demand build artifacts. During PPF pilot Phase 1, validated HTML continues
  to deploy automatically to the existing GitHub Pages production URL. A
  Cloudflare Workers Static Assets configuration is staged but is not active
  production infrastructure until a Worker target, credentials, canonical URL,
  preview deployment, and cutover/redirect policy are confirmed. Build does not
  imply Release Approval. The legacy textbook/ LaTeX tree remains historical
  only and is not part of the active edit or build workflow. HARC-lite project
  governance is intentionally unchanged in this publishing-focused PR.
